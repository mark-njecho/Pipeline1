pipeline1name:Initial CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Python App
        run: python pipeline1.py

      - name: Build Docker Image
        run: docker build -t pipeline1-demo 
